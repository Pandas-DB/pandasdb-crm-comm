checkContent:
  handler: src/handlers/common/check_content.lambda_handler
  name: ${self:service}-${self:provider.stage}-check-content
  description: Check if WhatsApp message has content
  
getOrCreateLead:
  handler: src/handlers/common/get_or_create_lead.lambda_handler
  name: ${self:service}-${self:provider.stage}-get-or-create-lead
  description: Get existing lead or create new lead with contact method
  
checkLeadSpammer:
  handler: src/handlers/common/check_lead_spammer.lambda_handler
  name: ${self:service}-${self:provider.stage}-check-lead-spammer
  description: Check if lead is spammer based on activities
  
detectSpam:
  handler: src/handlers/common/detect_spam.lambda_handler
  name: ${self:service}-${self:provider.stage}-detect-spam
  description: AI-powered spam detection using Bedrock
  
createActivity:
  handler: src/handlers/common/create_activity.lambda_handler
  name: ${self:service}-${self:provider.stage}-create-activity
  description: Store inbound activity and activity content
  
generateResponse:
  handler: src/handlers/common/generate_response.lambda_handler
  name: ${self:service}-${self:provider.stage}-generate-response
  description: Generate AI responses for normal messages
  
generateSpamResponse:
  handler: src/handlers/common/generate_spam_response.lambda_handler
  name: ${self:service}-${self:provider.stage}-generate-spam-response
  description: Generate spam warning/blocking responses

sendMessage:
  handler: src/handlers/common/send_message.lambda_handler
  name: ${self:service}-${self:provider.stage}-send-message
  description: Send messages through various platforms (WhatsApp, Telegram, etc.)
  
whatsappWebhook:
  handler: src/handlers/phone/whatsapp_webhook.lambda_handler
  reservedConcurrency: 10
  name: ${self:service}-${self:provider.stage}-whatsapp-webhook
  description: Handle WhatsApp webhooks from Twilio
  events:
    - http:
        path: /whatsapp
        method: post
        cors: true

telegramWebhook:
  handler: src/handlers/phone/telegram_webhook.lambda_handler
  reservedConcurrency: 10
  name: ${self:service}-${self:provider.stage}-telegram-webhook
  description: Handle Telegram bot webhooks
  events:
    - http:
        path: /telegram
        method: post
        cors: true

chatApi:
  handler: src/handlers/api/chat_api.lambda_handler
  name: ${self:service}-${self:provider.stage}-chat-api
  description: Handle chat API requests with API key authentication
  events:
    - http:
        path: /chat
        method: post
        cors: true
        private: true

gmail-poller:
  handler: src/handlers/email/gmail_poller.lambda_handler
  description: Gmail polling handler that checks for new emails
  timeout: 60
  events:
    - schedule:
        rate: rate(${env:GMAIL_POLL_INTERVAL_MINUTES, '5'} minutes)
        enabled: true
        description: "Poll Gmail for new emails every X minutes"
  environment:
    PLATFORM: gmail

# ADMIN API Lambdas:
dailyAnalytics:
  handler: src/handlers/backoffice/get_daily_analytics.lambda_handler
  name: ${self:service}-${self:provider.stage}-daily-analytics
  description: Get daily analytics and statistics for admin dashboard
  timeout: 30

getLeadDetails:
  handler: src/handlers/backoffice/get_lead_details.lambda_handler
  name: ${self:service}-${self:provider.stage}-get-lead-details
  description: Get lead details with recent activities
  timeout: 30

getSpamActivities:
  handler: src/handlers/backoffice/get_spam_activities.lambda_handler
  name: ${self:service}-${self:provider.stage}-get-spam-activities
  description: Get recent spam activities with details
  timeout: 30
  
getSpamUsers:
  handler: src/handlers/backoffice/get_spam_users.lambda_handler
  name: ${self:service}-${self:provider.stage}-get-spam-users
  description: Get users classified as spammers
  timeout: 30

createLead:
  handler: src/handlers/backoffice/create_leads.lambda_handler
  name: ${self:service}-${self:provider.stage}-create-lead
  description: Create a new lead with contact methods
  timeout: 30

listLeads:
  handler: src/handlers/backoffice/list_leads.lambda_handler
  name: ${self:service}-${self:provider.stage}-list-leads
  description: List all leads with pagination
  timeout: 30

removeSpamActivities:
  handler: src/handlers/backoffice/remove_spam_activities.lambda_handler
  name: ${self:service}-${self:provider.stage}-remove-spam-activities
  description: Remove spam activities for a lead
  timeout: 30

configManagement:
  handler: src/handlers/backoffice/config_management.lambda_handler
  name: ${self:service}-${self:provider.stage}-config-management
  description: Manage business configuration settings
  timeout: 30
  environment:
    S3_KNOWLEDGE_BUCKET: !Ref KnowledgeBaseBucket

twilioCredentials:
  handler: src/handlers/backoffice/update_twilio_credentials.lambda_handler
  name: ${self:service}-${self:provider.stage}-twilio-credentials
  description: Manage Twilio credentials
  timeout: 30

backofficeWeb:
  handler: src/handlers/backoffice/web_interface.lambda_handler
  name: ${self:service}-${self:provider.stage}-backoffice-web
  description: Secure web interface for CRM backoffice
  timeout: 30
  memorySize: 512
  environment:
    ADMIN_API_ID: !Ref AdminRestApi
    SESSIONS_TABLE: !Ref BackofficeSessionsTable
    S3_KNOWLEDGE_BUCKET: !Ref KnowledgeBaseBucket
  events:
    - http:
        path: backoffice
        method: ANY
    - http:
        path: backoffice/{proxy+}
        method: ANY
