Resources:
  # DynamoDB table for session storage
  BackofficeSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${self:service}-${self:provider.stage}-backoffice-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Service
          Value: ${self:service}
        - Key: Stage
          Value: ${self:provider.stage}

  # API Gateway for backoffice web interface
  BackofficeWebApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: ${self:service}-${self:provider.stage}-backoffice-web
      Description: Secure web interface for CRM backoffice
      EndpointConfiguration:
        Types:
          - REGIONAL
  # Root resource method (handles all requests)
  BackofficeWebRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BackofficeWebApi
      ResourceId: !GetAtt BackofficeWebApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BackofficeWebLambdaFunction.Arn}/invocations"
  # Proxy resource for handling all paths
  BackofficeWebProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BackofficeWebApi
      ParentId: !GetAtt BackofficeWebApi.RootResourceId
      PathPart: "{proxy+}"
  BackofficeWebProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BackofficeWebApi
      ResourceId: !Ref BackofficeWebProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BackofficeWebLambdaFunction.Arn}/invocations"
  # API Gateway deployment
  BackofficeWebDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - BackofficeWebRootMethod
      - BackofficeWebProxyMethod
    Properties:
      RestApiId: !Ref BackofficeWebApi
      StageName: ${self:provider.stage}
  # Lambda permission for API Gateway
  BackofficeWebLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackofficeWebLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BackofficeWebApi}/*/*"
Outputs:
  SecureBackofficeUrl:
    Description: "Secure Backoffice Web Interface URL"
    Value: !Sub "https://${BackofficeWebApi}.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}/backoffice"
  
  BackofficeSessionsTable:
    Description: "DynamoDB table for backoffice sessions"
    Value: !Ref BackofficeSessionsTable
